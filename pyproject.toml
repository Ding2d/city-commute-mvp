[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "city-commute-mvp"
version = "0.1.0"
description = "Chinese city commute scenario and inner monologue prototype"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
geo = ["osmnx>=2,<3", "geopandas>=1,<2", "shapely>=2,<3", "networkx>=3,<4"]

[project.scripts]
city-commute = "city_commute.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
city_commute = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
